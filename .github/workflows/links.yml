name: links

# Weekly dead-link check across every public Automatiqa Lab repository: README, docs and the other
# Markdown files, plus llms.txt. A failed run means a link in one of the listed repos has died.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - .github
          - auspex
          - flowtwin
          - gatewright
          - oodaa
          - orchestriq
          - ppwr-screener
          - procezio
          - risk-monitor
          - sample-trail
          - scopec
          - ship-doc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: automatiqa-lab/${{ matrix.repo }}
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --accept 200..=299,403,429
            --exclude-path node_modules
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '^https://www\.linkedin\.com/'
            './**/*.md' './**/llms.txt'
          fail: true
          jobSummary: true
          format: markdown
